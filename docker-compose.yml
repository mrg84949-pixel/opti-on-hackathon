services:
  postgres:
    image: postgres:16-alpine
    container_name: bot_saas_postgres
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
